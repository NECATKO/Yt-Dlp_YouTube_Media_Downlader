# Pinned downloads for the portable runtime (runtime/ next to downloader.py).
#
# Read by install.ps1 / install.sh (python) and by ytdlp_app/portable.py
# (ffmpeg, deno). One entry per line:
#
#   <component> <platform> <sha256> <url>
#
# Every file is checked against its sha256 before anything is unpacked. When a
# pin changes here, the next launch replaces that component automatically.
# yt-dlp itself is not pinned: it is installed with pip and kept current,
# because YouTube changes break older versions within weeks.


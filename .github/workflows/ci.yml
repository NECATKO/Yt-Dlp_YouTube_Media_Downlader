name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # ===========================================================================
  # Linting and Type Checking
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run mypy
        run: mypy ytdlp_app --ignore-missing-imports

  # ===========================================================================
  # Tests
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The engine tests generate media and inspect it with ffmpeg/ffprobe; without them
      # they skip themselves. Installing is best effort so a package-manager hiccup does
      # not fail the run.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      # Ubuntu's ffmpeg has every encoder the engine tests need, so there a missing tool
      # or encoder is a failure, not a skip. Other ffmpeg builds differ (Homebrew's has no
      # libaom-av1), so on macOS and Windows those tests skip themselves.
      # On Windows, update.ps1 and Run.bat run under the real PowerShell and cmd.exe
      # (tests/windows.py); there a missing tool is a failure, not a skip.
      - name: Run tests with coverage
        env:
          YTDLP_REQUIRE_ENGINE: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
          YTDLP_REQUIRE_WINDOWS_SCRIPTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
        run: pytest --cov=ytdlp_app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Build Package
  # ===========================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Check version consistency
        run: python scripts/check_version.py ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ===========================================================================
  # Create Portable Release
  # ===========================================================================
  release:
    name: Create Release
    runs-on: windows-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create portable package
        shell: pwsh
        run: |
          # Create release directory
          $releaseDir = "YtDlpDownloader-Portable"
          New-Item -ItemType Directory -Path $releaseDir -Force

          # Copy essential files
          Copy-Item -Path "ytdlp_app" -Destination $releaseDir -Recurse
          Copy-Item -Path "downloader.py" -Destination $releaseDir
          Copy-Item -Path "Run.bat" -Destination $releaseDir
          Copy-Item -Path "install.ps1" -Destination $releaseDir
          Copy-Item -Path "update.ps1" -Destination $releaseDir
          Copy-Item -Path "run.sh" -Destination $releaseDir
          Copy-Item -Path "install.sh" -Destination $releaseDir
          Copy-Item -Path "update.sh" -Destination $releaseDir
          # app_version.txt is what the updaters compare against the release tag.
          Copy-Item -Path "app_version.txt" -Destination $releaseDir
          # The runtime pins: first launch downloads Python, ffmpeg and Deno from these.
          Copy-Item -Path "runtime.lock" -Destination $releaseDir
          Copy-Item -Path "README.md" -Destination $releaseDir
          Copy-Item -Path "LICENSE" -Destination $releaseDir
          Copy-Item -Path "pyproject.toml" -Destination $releaseDir

          # Create archives directory
          New-Item -ItemType Directory -Path "$releaseDir/archives" -Force
          New-Item -ItemType Directory -Path "$releaseDir/logs" -Force

          # The asset name must stay stable across releases: update.ps1 looks the
          # asset up by exact name, so a version-stamped name is never found.
          Compress-Archive -Path $releaseDir -DestinationPath "YtDlpDownloader-Portable.zip"

          # The updaters verify the download against this when it is published.
          $hash = (Get-FileHash -Path "YtDlpDownloader-Portable.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "YtDlpDownloader-Portable.zip.sha256" -Value "$hash  YtDlpDownloader-Portable.zip" -Encoding ASCII

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YtDlpDownloader-Portable.zip
            YtDlpDownloader-Portable.zip.sha256
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  # ===========================================================================
  # Linting and Type Checking
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run mypy
        run: mypy ytdlp_app --ignore-missing-imports

  # ===========================================================================
  # Tests
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=ytdlp_app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Build Package
  # ===========================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ===========================================================================
  # Create Portable Release
  # ===========================================================================
  release:
    name: Create Release
    runs-on: windows-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create portable package
        shell: pwsh
        run: |
          # Create release directory
          $releaseDir = "YtDlpDownloader-Portable"
          New-Item -ItemType Directory -Path $releaseDir -Force

          # Copy essential files
          Copy-Item -Path "ytdlp_app" -Destination $releaseDir -Recurse
          Copy-Item -Path "downloader.py" -Destination $releaseDir
          Copy-Item -Path "Run.bat" -Destination $releaseDir
          Copy-Item -Path "install.ps1" -Destination $releaseDir
          Copy-Item -Path "update.ps1" -Destination $releaseDir
          Copy-Item -Path "README.md" -Destination $releaseDir
          Copy-Item -Path "LICENSE" -Destination $releaseDir
          Copy-Item -Path "pyproject.toml" -Destination $releaseDir

          # Create archives directory
          New-Item -ItemType Directory -Path "$releaseDir/archives" -Force
          New-Item -ItemType Directory -Path "$releaseDir/logs" -Force

          # Create ZIP
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path $releaseDir -DestinationPath "YtDlpDownloader-Portable-$version.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YtDlpDownloader-Portable-*.zip
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlp-downloader"
dynamic = ["version"]
description = "A portable cross-platform console application that wraps yt-dlp and ffmpeg for easy YouTube media downloading"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "NECATKO"}
]
keywords = [
    "yt-dlp",
    "youtube",
    "downloader",
    "video",
    "audio",
    "mp3",
    "mp4",
    "ffmpeg",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]

dependencies = [
    "yt-dlp>=2024.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/NECATKO/Yt-Dlp_YouTube_Media_Downlader"
Repository = "https://github.com/NECATKO/Yt-Dlp_YouTube_Media_Downlader"
Issues = "https://github.com/NECATKO/Yt-Dlp_YouTube_Media_Downlader/issues"

[project.scripts]
ytdlp-downloader = "ytdlp_app.app:run"

[tool.setuptools.dynamic]
version = {attr = "ytdlp_app.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ytdlp_app*"]

[tool.setuptools.package-data]
ytdlp_app = ["py.typed", "locales/*.json"]

# ============================================================================
# pytest configuration
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ============================================================================
# mypy configuration
# ============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ============================================================================
# ruff configuration
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    # Complexity heuristics. This is an interactive CLI: the main cycle walks
    # the user through a fixed sequence of prompts, and the error classifiers
    # are flat lookup chains. Splitting them to satisfy a counter would make
    # them harder to follow, not easier.
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLR0917",  # Too many positional arguments
    "PLR2004",  # Magic value used in comparison
]

[tool.ruff.lint.isort]
known-first-party = ["ytdlp_app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR"]

# ============================================================================
# coverage configuration
# ============================================================================
[tool.coverage.run]
source = ["ytdlp_app"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
